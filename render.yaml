# Render blueprint for the Quirex API (https://render.com/docs/blueprint-spec).
# In Render: New > Blueprint > pick this repository. You will be asked for the
# values marked `sync: false`.
services:
  - type: web
    name: quirex-api
    runtime: node
    rootDir: Backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render runs the app behind a proxy; this lets rate limits see real IPs.
      - key: TRUST_PROXY
        value: "1"
      # MongoDB Atlas connection string.
      - key: MONGODB_URI
        sync: false
      # Your frontend URL, e.g. https://quirex.vercel.app (comma-separate several).
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Cloudinary account URL (Cloudinary dashboard > API Keys >
      # "API environment variable"), e.g. cloudinary://key:secret@cloud_name.
      # Uploaded images are stored there. Without it they go to the instance's
      # disk, which the free plan wipes on every deploy and restart.
      - key: CLOUDINARY_URL
        sync: false
